<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Housing price prediction workflow">
  <rect width="900" height="420" fill="#f7fafc"/>
  <rect x="50" y="55" width="800" height="310" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="75" y="105" font-family="Arial" font-size="30" font-weight="700" fill="#111827">Housing Price Prediction Outcome</text>
  <rect x="80" y="145" width="180" height="120" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="112" y="195" font-family="Arial" font-size="18" font-weight="700" fill="#1e3a8a">Housing Data</text>
  <text x="111" y="225" font-family="Arial" font-size="14" fill="#1e40af">income, rooms, location</text>
  <path d="M270 205 H380" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="395" y="145" width="180" height="120" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="435" y="195" font-family="Arial" font-size="18" font-weight="700" fill="#14532d">Regression</text>
  <text x="430" y="225" font-family="Arial" font-size="14" fill="#166534">trained model bundle</text>
  <path d="M585 205 H695" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="710" y="145" width="105" height="120" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="735" y="193" font-family="Arial" font-size="18" font-weight="700" fill="#92400e">Value</text>
  <text x="729" y="224" font-family="Arial" font-size="14" fill="#92400e">prediction</text>
  <text x="80" y="315" font-family="Arial" font-size="16" fill="#374151">Final artifact: artifacts/housing_bundle.joblib and artifacts/training_metrics.json</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
